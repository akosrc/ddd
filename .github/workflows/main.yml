name: Build Dylib Only

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 1. Depoyu Klonla
      uses: actions/checkout@v4

    - name: 2. Theos Kurulumu
      run: |
        export THEOS=$HOME/theos
        export GIT_TERMINAL_PROMPT=0
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: 3. ldid Aracını Kur (Manuel)
      run: |
        # GitHub runner (macOS arm64) için ldid aracını manuel indir
        curl -L https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64 -o /usr/local/bin/ldid
        chmod +x /usr/local/bin/ldid

    - name: 4. Derleme Yap
      run: |
        make clean || true
        make || true

    - name: 5. TÜM Dosyaları Bul (Debug için)
      run: |
        echo "--- Tüm .dylib dosyaları ---"
        find . -name "*.dylib" -type f
        echo "--- .theos/obj içindekiler ---"
        ls -la .theos/obj/ || true
        echo "--- Ana dizindekiler ---"
        ls -la

    - name: 6. Dylib Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Derlenen-Dosyalar
        # Hem .dylib hem de derlenmiş diğer dosyaları ara
        path: |
          **/*.dylib
          .theos/obj/M7MD
        if-no-files-found: warn
