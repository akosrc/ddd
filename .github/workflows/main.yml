name: Build Dylib Only

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 1. Depoyu Klonla
      uses: actions/checkout@v4

    - name: 2. Theos Kurulumu ve ldid Ayarı
      run: |
        export THEOS=$HOME/theos
        export GIT_TERMINAL_PROMPT=0
        git clone --recursive https://github.com/theos/theos.git $THEOS
        
        # Theos'un içindeki ldid'yi kullan (en garantili yöntem)
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH
        echo "$THEOS/toolchain/linux_x86_64/bin" >> $GITHUB_PATH

    - name: 3. Derleme Yap (HATA VARSA DUR)
      run: |
        make clean
        make

    - name: 4. Dylib Dosyasını Bul ve Yükle
      if: success() # Sadece derleme başarılıysa çalışır
      uses: actions/upload-artifact@v4
      with:
        name: Derlenen-Dylib
        path: "**/*.dylib"
        if-no-files-found: error
