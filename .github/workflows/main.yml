name: Build Dylib Only

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 1. Depoyu Klonla
      uses: actions/checkout@v4

    - name: 2. Theos Kurulumu (Alt Modüllerle Birlikte)
      run: |
        export THEOS=$HOME/theos
        # Git'in kimlik doğrulama istemesini engelle
        export GIT_TERMINAL_PROMPT=0
        # Theos'u tüm alt modülleriyle (vendor/include, vendor/lib vb.) klonla
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: 3. Derleme Yap (Sadece Dylib)
      run: |
        make clean || true
        make

    - name: 4. Dylib Dosyasını Bul ve İndirme Butonu Olarak Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Derlenen-Dylib
        path: "**/*.dylib"
        if-no-files-found: warn
