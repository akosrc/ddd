name: Build Dylib Only

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 1. Depoyu Klonla
      uses: actions/checkout@v4

    - name: 2. Theos Kurulumu
      run: |
        export THEOS=$HOME/theos
        export GIT_TERMINAL_PROMPT=0
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: 3. ldid Kurulumu (Homebrew ile)
      run: |
        brew install ldid

    - name: 4. Derleme Yap
      run: |
        make clean || true
        make || true

    - name: 5. Dylib Dosyasını Bul ve Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Derlenen-Dylib
        path: "**/*.dylib"
        if-no-files-found: warn
