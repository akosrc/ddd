name: Build Dylib to Packages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 1. Depoyu Klonla
      uses: actions/checkout@v4

    - name: 2. Theos Kurulumu
      run: |
        export THEOS=$HOME/theos
        export GIT_TERMINAL_PROMPT=0
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: 3. ldid Aracını Kur
      run: |
        curl -L https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64 -o /usr/local/bin/ldid
        chmod +x /usr/local/bin/ldid

    - name: 4. Derleme Yap
      run: |
        make clean || true
        make

    - name: 5. Dylib Dosyasını Packages Klasörüne Kopyala
      run: |
        # Derlenen .dylib dosyasını bul ve senin oluşturduğun Packages klasörüne kopyala
        find .theos/obj -name "*.dylib" -exec cp {} Packages/ \;
        
        # Klasörün içini kontrol et (Loglarda görmek için)
        echo "Packages klasoru icerigi:"
        ls -la Packages/

    - name: 6. Packages Klasöründeki Dosyaları Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Packages
        path: Packages/
        if-no-files-found: error
