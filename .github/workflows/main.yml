name: Build Dylib Only

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 1. Depoyu Klonla
      uses: actions/checkout@v4

    - name: 2. Theos Kurulumu (Otomatik Güncelleme ile)
      run: |
        export THEOS=$HOME/theos
        mkdir -p $THEOS
        
        # Theos'u ZIP ile indir
        curl -L https://github.com/theos/theos/archive/refs/heads/master.zip -o theos.zip
        unzip -q theos.zip
        mv theos-master/* $THEOS
        rm -rf theos.zip theos-master
        
        # KRİTİK ADIM: Theos'un kendi güncelleme scriptini çalıştır
        # Bu komut eksik olan vendor/include ve vendor/lib klasörlerini otomatik indirir
        $THEOS/bin/update-theos
        
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    - name: 3. Derleme Yap (Sadece Dylib)
      run: |
        make clean || true
        make

    - name: 4. Dylib Dosyasını Bul ve İndirme Butonu Olarak Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Derlenen-Dylib
        path: "**/*.dylib"
        if-no-files-found: warn
